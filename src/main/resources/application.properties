server.port=0

# ---- 资源成本估算与预算预测告警 ----
# 迟到宽限（毫秒）：账期结束后超过该时间到达的用量按 LATE_BEYOND_GRACE 跳过
cost.late-grace-millis=3600000
# 批次检查点目录（已提交批次日志，用于重启恢复）
cost.checkpoint-dir=build/checkpoints
# 批次默认超时（毫秒）
cost.batch-timeout-millis=30000
# 预测默认窗口长度（历史账期数）
cost.forecast-window=7
# 预测默认随机种子（相同输入+种子结果可复现）
cost.forecast-seed=42
